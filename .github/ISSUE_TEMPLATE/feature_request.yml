name: Feature request
description: Propose a scoped, maintainable ChronosX improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Include affected APIs, scope behavior, and fallback behavior.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Explain how this remains per-package and avoids breaking target app behavior.
    validations:
      required: true
