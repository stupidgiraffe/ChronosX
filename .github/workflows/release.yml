name: Publish release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v1.0.0
        required: true
        type: string
      signing_keystore_base64:
        description: One-time authenticated bootstrap input; use repository secrets for normal releases.
        required: false
        type: string
      signing_store_password:
        description: One-time authenticated bootstrap input; use repository secrets for normal releases.
        required: false
        type: string
      signing_key_alias:
        description: One-time authenticated bootstrap input; use repository secrets for normal releases.
        required: false
        type: string
      signing_key_password:
        description: One-time authenticated bootstrap input; use repository secrets for normal releases.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHRONOSX_RELEASE_KEYSTORE_BASE64: ${{ inputs.signing_keystore_base64 || secrets.CHRONOSX_RELEASE_KEYSTORE_BASE64 }}
      CHRONOSX_RELEASE_STORE_PASSWORD: ${{ inputs.signing_store_password || secrets.CHRONOSX_RELEASE_STORE_PASSWORD }}
      CHRONOSX_RELEASE_KEY_ALIAS: ${{ inputs.signing_key_alias || secrets.CHRONOSX_RELEASE_KEY_ALIAS }}
      CHRONOSX_RELEASE_KEY_PASSWORD: ${{ inputs.signing_key_password || secrets.CHRONOSX_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Validate signing configuration
        run: |
          test -n "$CHRONOSX_RELEASE_KEYSTORE_BASE64"
          test -n "$CHRONOSX_RELEASE_STORE_PASSWORD"
          test -n "$CHRONOSX_RELEASE_KEY_ALIAS"
          test -n "$CHRONOSX_RELEASE_KEY_PASSWORD"
      - name: Decode release keystore
        run: |
          # Accept the value alone (preferred) or the full NAME=VALUE line from
          # the private setup bundle. Remove copy/paste whitespace without
          # touching Base64 padding.
          encoded="${CHRONOSX_RELEASE_KEYSTORE_BASE64#CHRONOSX_RELEASE_KEYSTORE_BASE64=}"
          encoded="$(printf '%s' "$encoded" | tr -d '[:space:]')"
          if ! printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/chronosx-release.p12"; then
            echo "::error::The CHRONOSX_RELEASE_KEYSTORE_BASE64 secret is not valid Base64. Replace it with the value from the private setup bundle, or paste its complete NAME=VALUE line."
            exit 1
          fi
      - name: Verify release keystore identity
        run: |
          # This is the SHA-256 of the private PKCS#12 container generated for
          # ChronosX. It is not a credential; it only detects a mismatched or
          # stale Base64 secret before Gradle spends time compiling the app.
          expected_sha256="2cc757629a457149141481b07dfe379d2cc32f1c68d9ff9f750a6345d9418941"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/chronosx-release.p12" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::The decoded keystore is not the ChronosX release keystore. Replace CHRONOSX_RELEASE_KEYSTORE_BASE64 with the original private setup value."
            exit 1
          fi
          if ! keytool -list \
            -keystore "$RUNNER_TEMP/chronosx-release.p12" \
            -storetype PKCS12 \
            -storepass "$CHRONOSX_RELEASE_STORE_PASSWORD" \
            -alias "$CHRONOSX_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::CHRONOSX_RELEASE_STORE_PASSWORD or CHRONOSX_RELEASE_KEY_ALIAS does not unlock the verified ChronosX release keystore. Replace that secret with its exact original value."
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test --stacktrace
      - name: Build signed release APK
        run: |
          # PKCS#12 uses the store password for its private-key entry. Passing
          # it explicitly avoids a stale duplicate key-password secret.
          ./gradlew :app:assembleRelease :lab-sdk:assembleRelease --stacktrace \
            -Pchronosx.releaseStoreFile="$RUNNER_TEMP/chronosx-release.p12" \
            -Pchronosx.releaseStorePassword="$CHRONOSX_RELEASE_STORE_PASSWORD" \
            -Pchronosx.releaseKeyAlias="$CHRONOSX_RELEASE_KEY_ALIAS" \
            -Pchronosx.releaseKeyPassword="$CHRONOSX_RELEASE_STORE_PASSWORD"
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Name release artifact
        id: release
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "ChronosX-${tag}.apk"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ChronosX $TAG" --generate-notes
          gh release upload "$TAG" "ChronosX-${TAG}.apk" --clobber
